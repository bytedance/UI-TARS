[project]
name = "ui-tars"
version = "0.1.4"
description = "Parsing LLM-generated GUI action instructions, automatically generating pyautogui scripts, and supporting coordinate conversion and smart image resizing."
readme = "README.md"
authors = [
    { name = "liangshihao.0828", email = "liangshihao.0828@bytedance.com" },
    { name = "jinxin001", email = "jinxin001@bytedance.com" }
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
dev = [
    "matplotlib>=3.10.3",
    "pillow>=11.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.test]
scripts.test = "python -m unittest discover tests '*_test.py'"

[tool.hatch.build]
include = [
    "ui_tars/**/*.py",
    "!ui_tars/**/tests/*.py",
    "!ui_tars/**/tests.py"
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
